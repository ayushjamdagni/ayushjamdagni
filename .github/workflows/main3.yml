name: Generate Snake Animation

on:
  schedule:
    # Runs at 12:00 AM UTC every day
    - cron: "0 0 * * *"
  # Allows you to manually trigger the workflow from the Actions tab
  workflow_dispatch:
  # Runs on every push to the main branch
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5 # Prevents it from hanging and wasting action minutes
    
    steps:
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Correctly maps standard GitHub light theme greens for light mode, and dark theme greens for dark mode.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#58A6FF&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#58A6FF&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "Update snake animations" # Keeps your repository commit history clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
